<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CS XI Teach Yourself</title>
  <link rel="stylesheet" href="css/app.css" />
  <script>
    window.MathJax = {
      startup: { typeset: false },
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      svg: { fontCache: "local" }
    };
  </script>
  <script src="vendor/mathjax/tex-svg.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="data/lectures.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="nav-back" class="icon-btn" type="button" hidden aria-label="Back">←</button>
      <div class="brand">
        <p class="eyebrow">Computer Science XI</p>
        <h1 id="title">Teach Yourself Edition</h1>
      </div>
      <p class="badge" id="voice-badge">TTS</p>
    </header>
    <main id="stage" class="stage"></main>
    <footer id="player" class="player" hidden>
      <button id="play" class="play" type="button">Sunain</button>
      <button id="stop" class="ghost" type="button">Rokein</button>
      <label class="rate">Speed
        <input id="rate" type="range" min="0.75" max="1.25" step="0.05" value="0.92" />
      </label>
      <p id="player-status" class="player-status">Urdish lecture</p>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
