<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS XI — Cinematic Self-Taught Teacher · Ultimate Edition</title>
  <meta name="description" content="Bilingual cinematic lecture notes for Computer Science XI (Sindh Curriculum 2026). English & Urdu TTS, MathJax, SVG diagrams." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cinematic.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="letterbox letterbox-top" aria-hidden="true"></div>
  <div class="letterbox letterbox-bottom" aria-hidden="true"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-badge">Ultimate</span>
      <h1>CS XI · Self-Taught Cinema</h1>
      <p class="subtitle">Teacher's Lecture Notes · Sindh Curriculum 2026</p>
    </div>
    <div class="header-controls">
      <div class="lang-toggle" role="group" aria-label="Display language">
        <button type="button" class="lang-btn active" data-lang="en">English</button>
        <button type="button" class="lang-btn" data-lang="ur">اردو</button>
        <button type="button" class="lang-btn" data-lang="both">Both</button>
      </div>
      <div class="tts-toggle" role="group" aria-label="Narration language">
        <button type="button" class="tts-btn active" data-tts="en" title="English voice">🔊 EN</button>
        <button type="button" class="tts-btn" data-tts="ur" title="Urdu voice">🔊 اردو</button>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="coach-panel" id="coachPanel">
      <div class="coach-avatar" aria-hidden="true">🎬</div>
      <p class="coach-name" data-i18n="coachName">Coach Amal</p>
      <p class="coach-msg" id="coachMessage"></p>
      <div class="progress-ring-wrap">
        <svg class="progress-ring" viewBox="0 0 36 36">
          <path class="progress-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          <path class="progress-fill" id="progressArc" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
        </svg>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <label class="micro-win">
        <input type="checkbox" id="microWinMode" checked />
        <span data-i18n="microWin">2-minute wins only</span>
      </label>
    </div>
    <nav class="chapter-nav" id="chapterNav" aria-label="Chapters"></nav>
  </aside>

  <main class="stage" id="stage">
    <div class="module-bar">
      <span class="module-id" id="moduleId"></span>
      <span class="golden-star" id="goldenBadge" hidden>★ Golden</span>
      <h2 class="module-title" id="moduleTitle"></h2>
    </div>

    <article class="slide-card cinematic-reveal" id="slideCard">
      <div class="slide-meta">
        <span id="slideIndex"></span>
      </div>
      <div class="slide-content" id="slideContent"></div>
      <figure class="diagram-frame" id="diagramFrame" hidden>
        <div class="diagram-inner ken-burns" id="diagramHost"></div>
        <figcaption id="diagramCaption"></figcaption>
      </figure>
      <div class="karaoke-line" id="karaokeLine" aria-live="polite"></div>
    </article>

    <div class="transport">
      <button type="button" class="btn ghost" id="btnPrevModule" title="Previous topic">⟨ Topic</button>
      <button type="button" class="btn ghost" id="btnPrevSlide">⟨ Slide</button>
      <button type="button" class="btn primary" id="btnPlayPause" aria-pressed="false">
        <span class="play-label">▶ Narrate</span>
      </button>
      <button type="button" class="btn ghost" id="btnNextSlide">Slide ⟩</button>
      <button type="button" class="btn accent" id="btnNextModule" title="Next topic">Topic ⟩</button>
    </div>
  </main>

  <footer class="app-footer">
    <p>★ = examination-critical · Voices: <strong>English</strong> & <strong>Urdu only</strong> · Diagrams: inline SVG · Math: MathJax</p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
